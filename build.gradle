plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.126'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // JEI, Botany Pots, Bookshelf, Ender Storage, Code Chicken Lib, The One Probe
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }
    // Ender Storage
    maven {
        url = "https://maven.covers1624.net"
    }
    // Botany Pots
    maven {
        url = "https://maven.blamejared.com"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI to view recipes
    localRuntime "maven.modrinth:jei:ae5o0o24"

    // Botany Pots
    localRuntime "maven.modrinth:botany-pots:66uZFLBG"
    implementation "net.darkhax.botanypots:BotanyPots-Common-1.20.4:16.1.6"
    implementation "net.darkhax.botanypots:BotanyPots-NeoForge-1.20.4:16.1.6"
    // Bookshelf dependency
    localRuntime "maven.modrinth:bookshelf-lib:WheiIvOy"
    implementation "net.darkhax.bookshelf:Bookshelf-Common-1.20.4:23.1.11"
    implementation "net.darkhax.bookshelf:Bookshelf-NeoForge-1.20.4:23.1.11"

    // Ender Storage
    localRuntime "maven.modrinth:ender-storage:DCf9s8BM"
    implementation "io.codechicken:EnderStorage:1.20.4-2.12.0.189"
    // // Code Chicken Lib dependency
    localRuntime "maven.modrinth:codechicken-lib:4xAJvmwX"
    implementation "io.codechicken:CodeChickenLib:1.20.4-4.5.0.517"

    // TOP (The one probe)
    localRuntime "maven.modrinth:the-one-probe:APaGaSwq"
    compileOnly "maven.modrinth:the-one-probe:APaGaSwq"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
