plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    // Jei, Cucumber, Botany Pots, Bookshelf, Ender Storage, Code Chicken Lib, The One Probe
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            forRepositories(fg.repository)
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }
    // Ender Storage, Code Chicken Lib
    maven {
        url = "https://maven.covers1624.net"
    }
    // Botany Pots
    maven {
        url = "https://maven.blamejared.com"
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI (to view recipes)
    runtimeOnly fg.deobf("maven.modrinth:jei:ruHSy16N")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.20.0.127")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.20.0.127")

    // Cucumber Library (to view tags)
    runtimeOnly fg.deobf("maven.modrinth:cucumber:xnLznSfT")

    // Botany Pots
    runtimeOnly fg.deobf("maven.modrinth:botany-pots:9bH71LWw")
    implementation fg.deobf("net.darkhax.botanypots:BotanyPots-Common-1.20.1:13.0.41")
    implementation fg.deobf("net.darkhax.botanypots:BotanyPots-Forge-1.20.1:13.0.41")
    // Bookshelf dependency
    runtimeOnly fg.deobf("maven.modrinth:bookshelf-lib:CBnLZwRS")
    implementation fg.deobf("net.darkhax.bookshelf:Bookshelf-Forge-1.20.1:20.2.13")
    implementation fg.deobf("net.darkhax.bookshelf:Bookshelf-Common-1.20.1:20.2.13")

    // Ender Storage
    runtimeOnly fg.deobf("maven.modrinth:ender-storage:pTEnM5jC")
    implementation fg.deobf("io.codechicken:EnderStorage:1.20.1-2.11.0.188:universal")
    // Code Chicken Lib dependency
    runtimeOnly fg.deobf("maven.modrinth:codechicken-lib:pxajg7Ob")
    implementation fg.deobf("io.codechicken:CodeChickenLib:1.20.1-4.4.0.516:universal")

    // TOP (The one probe)
    runtimeOnly fg.deobf("maven.modrinth:the-one-probe:r7iv0zP9")
    compileOnly fg.deobf("maven.modrinth:the-one-probe:r7iv0zP9")

    // Botany Pots Tiers
    runtimeOnly fg.deobf("maven.modrinth:botany-pots-tiers:3yo9bQAH")
    compileOnly fg.deobf("maven.modrinth:botany-pots-tiers:3yo9bQAH")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
