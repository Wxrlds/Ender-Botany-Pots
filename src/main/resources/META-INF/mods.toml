modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Wxrlds/EnderBotanyPots"

# Ender Botany Pots
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Wxrlds/EnderBotanyPots"
credits = "Darkhax for Botany Pots and covers1624 for Ender Storage"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Forge
[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

# Minecraft
[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Botany Pots
[[dependencies.${ mod_id }]]
modId = "botanypots"
mandatory = true
versionRange = "[1.20.1-13,)"
ordering = "NONE"
side = "BOTH"

# Botany Pots Tiers
[[dependencies.${ mod_id }]]
modId = "botanypotstiers"
mandatory = true
versionRange = "[6,)"
ordering = "NONE"
side = "BOTH"

# Ender Storage
[[dependencies.${ mod_id }]]
modId = "enderstorage"
mandatory = true
versionRange = "[1.20.1-2.11,)"
ordering = "NONE"
side = "BOTH"